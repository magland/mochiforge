# Publishes the container image that `mochi deploy fly` deploys.
#
# Two kinds of event produce an image. A version tag, which the publish
# workflow creates after a successful npm release, is tagged with that version
# and moves `latest`; a successful ci run on main is tagged `main` and nothing
# else. So the image tags follow the released versions rather than tracking
# them separately, and `deploy` can pin to the CLI's own version and expect to
# find it.
#
# Nothing is pushed to the registry until the tests that cover it have passed.
# For main that means waiting on the ci workflow and building the commit ci
# actually tested, rather than whatever is at the head of the branch by then.
# For a version tag the gate is publish.yml, which builds and smoke-tests
# before it publishes to npm and only then creates the tag, so a tag that
# exists is already a tag that passed. Note that ci does not run on tags, so
# a workflow_run gate would never fire for them.
#
# The image is linux/amd64, which is what Fly machines run. Anyone wanting
# another architecture builds the Dockerfile, which is the same one used here.
#
# A published image is then deployed to the vaults listed in the deploy job at
# the bottom, so that those vaults run the newest image that passed rather than
# waiting for someone to run a deploy by hand. That job needs a FLY_API_TOKEN
# repository secret; docs/deploying.md, under "Updating on a schedule", covers
# what such a token has to be able to do and why nothing secret comes back out
# of a deploy to an existing app.
#
# One thing this workflow cannot do for you: a newly created GitHub package is
# private, and Fly pulls anonymously. After the first successful run, set the
# package to public under Packages > mochi > Package settings, or deploys
# will fail to pull the image.
name: image

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A failed, cancelled, or skipped ci run must not publish an image. The
    # other two triggers carry no ci run to consult and are allowed through.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write # to push to ghcr.io
    # The one tag the deploy job below pulls, so that what reaches a vault is
    # the image this run built rather than whatever `main` or `latest` points
    # at by the time the deploy starts.
    outputs:
      image: ${{ steps.tags.outputs.ref }}
      runner-image: ${{ steps.tags.outputs.runner-ref }}
    steps:
      # On a workflow_run event the default ref is the head of the default
      # branch, which need not be the commit ci tested. Build that commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag is a release: it gets the bare version, and takes over
      # `latest`. Everything else is main, and is not a release.
      - name: Work out the tags
        id: tags
        run: |
          image=ghcr.io/${{ github.repository_owner }}/mochi
          # The runner is a second image from the same commit and carries the
          # same tags, because a runner and the vault it serves speak one
          # protocol and are released together.
          runner=$image-runner
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
            echo "ref=$image:$version" >> "$GITHUB_OUTPUT"
            echo "runner-tags=$runner:$version,$runner:latest" >> "$GITHUB_OUTPUT"
            echo "runner-ref=$runner:$version" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:main" >> "$GITHUB_OUTPUT"
            echo "ref=$image:main" >> "$GITHUB_OUTPUT"
            echo "runner-tags=$runner:main" >> "$GITHUB_OUTPUT"
            echo "runner-ref=$runner:main" >> "$GITHUB_OUTPUT"
          fi

      # The tag must match the version in package.json, since that version is
      # what the CLI asks the registry for. A mismatch would publish an image
      # under a tag no `mochi deploy` will ever request.
      - name: Check the tag against package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          }

      # What the image tells the reader it is running. The image build gets no
      # .git of its own (the context excludes it), so the commit is read here,
      # from the checkout above, and passed in as a build argument. Without it
      # every image would report an unknown build.
      - name: Stamp the build
        id: stamp
        run: |
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            MOCHI_BUILD_COMMIT=${{ steps.stamp.outputs.commit }}
            MOCHI_BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.runner-tags }}
          build-args: |
            MOCHI_BUILD_COMMIT=${{ steps.stamp.outputs.commit }}
            MOCHI_BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runner image's one hard requirement is a Docker daemon that comes
      # up inside it, which is the part most likely to break under a base image
      # bump and the part no unit test can reach. The runner is then expected
      # to refuse for want of a token: it only gets that far after the
      # entrypoint has satisfied itself that the daemon is usable.
      - name: Run the runner image and check its Docker daemon comes up
        run: |
          tag=$(echo "${{ steps.tags.outputs.runner-tags }}" | cut -d, -f1)
          docker run -d --privileged --name runnercheck \
            -e MOCHI_HOST=http://127.0.0.1:1 "$tag"
          for _ in $(seq 1 90); do
            docker logs runnercheck 2>&1 | grep -q 'No runner credentials' && break
            sleep 1
          done
          logs=$(docker logs runnercheck 2>&1)
          docker rm -f runnercheck >/dev/null
          echo "$logs"
          case "$logs" in
            *'The Docker daemon did not come up'*)
              echo "the runner image could not start its own Docker daemon"
              exit 1
              ;;
          esac
          echo "$logs" | grep -q 'No runner credentials' || {
            echo "the runner never reached the point of asking for a token"
            exit 1
          }

      # An image that cannot serve a vault is worse than no image, and this is
      # the last point where that is cheap to find out.
      - name: Run the image and check it serves a fresh vault
        run: |
          tag=$(echo "${{ steps.tags.outputs.tags }}" | cut -d, -f1)
          docker run -d --name check -p 3000:3000 "$tag"
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          docker logs check
          docker rm -f check >/dev/null
          [ "$code" = "200" ] || { echo "the image did not answer 200"; exit 1; }

      # The path `mochi deploy` relies on: the server adopts an owner token
      # supplied in the environment, rather than minting one and printing it.
      - name: Check the owner token can be supplied to the image
        run: |
          tag=$(echo "${{ steps.tags.outputs.tags }}" | cut -d, -f1)
          token="mochi_$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          docker run -d --name preset -p 3001:3000 -e "MOCHI_OWNER_TOKEN=$token" "$tag"
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3001/ && break
            sleep 1
          done
          who=$(curl -s -H "authorization: Bearer $token" http://127.0.0.1:3001/api/whoami)
          logs=$(docker logs preset 2>&1)
          docker rm -f preset >/dev/null
          echo "$logs"
          echo "$who" | grep -q '"username":"owner"' || {
            echo "the supplied owner token was not adopted: $who"
            exit 1
          }
          # The token was handed in, so the server has no reason to log it.
          if echo "$logs" | grep -q "$token"; then
            echo "the server echoed the supplied owner token into its log"
            exit 1
          fi

  # The vaults that follow the published image, redeployed as soon as one is
  # built. Each app is one entry in this list; adding a vault is adding a line,
  # and the matrix keeps one failing app from stopping the others.
  #
  # Deploying the exact tag this run built, rather than letting the CLI pick its
  # own version, is what makes a main build reach a vault at all: on main the
  # image is tagged `main`, and no released version answers to it.
  #
  # This runs only for images built from this repository's own commits. A
  # workflow_dispatch on a branch would otherwise deploy that branch's image to
  # a live vault, which is not what dispatching a rebuild means.
  deploy:
    needs: image
    if: github.repository == 'magland/mochiforge' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The vault, redeployed in place. Needs nothing but the Fly credential.
          - app: vault1
            command: deploy fly vault1
            image: image
            token: FLY_API_TOKEN
          # The runner beside it. A runner and the vault it serves speak one
          # protocol (the lease headers are named after the project, and the
          # rename proved what happens when only one side moves), so the runner
          # follows the vault on every build. --image-only updates the machine
          # and touches neither the vault's registry nor the app's secrets,
          # which is what lets this job run with only the Fly credential too.
          # Each app has a Fly deploy token scoped to itself, so each entry
          # names the secret holding its own; one credential per app is the
          # narrowest arrangement, and a token scoped to the vault cannot see
          # the runner app at all.
          - app: vault1-runner
            command: deploy fly runner vault1-runner --image-only
            image: runner-image
            token: FLY_API_TOKEN_RUNNER
    steps:
      # The CLI that drives the deploy is this commit's, so it stays in step
      # with the image it is deploying.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # A vault whose app already has a machine mints no owner token and prints
      # nothing secret, so there is nothing here for a log to leak. The region,
      # the volume size, and the machine's shape are read back off the live app,
      # which is why no flag describing them appears.
      - name: Deploy ${{ matrix.app }}
        run: node dist/index.js ${{ matrix.command }} --image "$IMAGE"
        env:
          IMAGE: ${{ needs.image.outputs[matrix.image] }}
          FLY_API_TOKEN: ${{ secrets[matrix.token] }}
