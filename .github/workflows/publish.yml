# Publishes @magland/mochi to npm when a push to main touches
# package.json, which is where a version bump lives. Any other push is not a
# release and does not start this workflow at all.
#
# Authentication is npm trusted publishing: npm trades this workflow's OIDC
# identity for a short-lived, single-publish credential, so there is no token
# in the repository secrets to leak or rotate. npm accepts the exchange only
# from the exact repository and workflow filename registered as the package's
# trusted publisher, so renaming this file breaks publishing until the setting
# on npmjs.com is updated to match.
name: publish

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# Two pushes in quick succession must not race to publish the same version.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release tag
      id-token: write # to mint the OIDC token npm exchanges for a credential
      actions: write # to start the image workflow for the tag (see the last step)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 already ships a
      # new enough npm, but the runner's bundled version is not ours to pin,
      # so ask for one explicitly. An exact version rather than @latest: this
      # is the job that holds the publishing credential, and whatever npm
      # itself ships tomorrow should not be the first to run with it.
      - name: Use an npm that can publish with OIDC
        run: |
          npm install -g npm@12.0.2
          npm --version

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The same insistence ci.yml makes, for the same reason: the suite skips
      # its git-lfs checks when the client is absent, and a release is the
      # last place a quietly smaller suite should pass.
      - name: Require git-lfs, so its checks cannot be skipped
        run: git lfs version

      - name: Smoke test
        run: npm run smoke

      # No NODE_AUTH_TOKEN: the credential comes from the OIDC exchange above.
      # Provenance is generated as part of trusted publishing; the flag makes
      # the intent explicit and fails the publish loudly if it cannot be met.
      #
      # An edit to package.json that leaves the version alone reaches here and
      # is refused by the registry, which is the intended trade: the trigger
      # asks one cheap question of git rather than a second one of npm.
      - name: Publish
        run: npm publish --provenance

      - name: Tag the release
        run: |
          version=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists; leaving it alone."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version"
          git push origin "v$version"

      # The image for the release, asked for by name. image.yml declares a
      # trigger on tag pushes, but a push made with the workflow's own token
      # starts no workflow: GitHub excepts only workflow_dispatch and
      # repository_dispatch from that rule, so the tag push above has never
      # built an image, and no released version has ever had one under its
      # own tag. Dispatching on the tag's ref is the exception the rule allows,
      # and image.yml reads the version off the ref exactly as it would have
      # for the push.
      - name: Build the image for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh workflow run image.yml --ref "v$version"
